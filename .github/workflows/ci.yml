name: CI

# Enforces the AGENTS.md rule: "build on both compilers, always." Every push to
# main and every pull request builds + tests venice-cpp on GCC and Clang across
# the default toolchain and each sanitizer, so a change that only builds on one
# compiler fails visibly instead of being discovered by the next person.
#
# The project name is spelled out in the root CMakeLists.txt rather than derived
# from the checkout directory, so nothing here depends on where the runner puts
# the source. The status badge lives at the top of README.md.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04   # ships GCC 13 + Clang (both C++23-capable); pinned for reproducibility
    strategy:
      fail-fast: false      # always show every compiler's result, not just the first failure
      matrix:
        include:
          - { name: "gcc / default",   cxx: g++,     toolchain: default.cmake,   build_type: Debug }
          - { name: "gcc / asan",      cxx: g++,     toolchain: address.cmake,   build_type: Debug }
          - { name: "gcc / tsan",      cxx: g++,     toolchain: thread.cmake,    build_type: RelWithDebInfo }
          - { name: "gcc / ubsan",     cxx: g++,     toolchain: undefined.cmake, build_type: Debug }
          - { name: "clang / default", cxx: clang++, toolchain: clang.cmake,     build_type: Debug }
          - { name: "clang / asan",    cxx: clang++, toolchain: address.cmake,   build_type: Debug }
          - { name: "clang / tsan",    cxx: clang++, toolchain: thread.cmake,    build_type: RelWithDebInfo }
          - { name: "clang / ubsan",   cxx: clang++, toolchain: undefined.cmake, build_type: Debug }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history + tags so cmake/version.cmake's `git describe --tags` resolves a real version

      # OpenSSL is a hard requirement, twice over: src/lib/CMakeLists.txt calls
      # find_package(OpenSSL REQUIRED), and cmake/deps/httplib.cmake forces
      # HTTPLIB_REQUIRE_OPENSSL ON so cpp-httplib demands it too. The runner image
      # currently ships libssl-dev, but installing it explicitly means a change to
      # that image manifest is not a mystery build failure six months from now.
      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # GCC jobs use the preinstalled g++ (13). The clang jobs must NOT use
      # ubuntu-24.04's stock clang 18: its libstdc++ pairing cannot compile C++23
      # std::expected, and venice-cpp puts std::expected in the *public* header
      # (include/venice/client.hpp — every fallible entry point returns one). So
      # unlike upstream, where a single test dir was affected, stock clang 18 here
      # fails all four clang jobs outright. Pin to a known-good Clang so "both
      # compilers, always" stays honest. The symlinks make `clang++` resolve to the
      # pinned version, so clang.cmake's find_program and the sanitizer toolchains'
      # $CXX both pick it up.
      - name: Install Clang
        if: ${{ startsWith(matrix.cxx, 'clang') }}
        env:
          CLANG_VERSION: "20"
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang-$CLANG_VERSION"   /usr/local/bin/clang
          sudo ln -sf "/usr/bin/clang++-$CLANG_VERSION" /usr/local/bin/clang++
          clang++ --version

      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}   # default/sanitizer toolchains respect $CXX; clang.cmake selects clang itself
        run: >
          cmake -B build
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/${{ matrix.toolchain }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # Runs the offline Catch2 suites (01client, 30sanitizer-smoke), the
        # version-parse self-test and the artifact check. No API key, no network:
        # the live smoke binary needs $VENICE_API_KEY and is never invoked here.
        run: ctest --test-dir build --output-on-failure

  # The VC-07 acceptance check: a miniature downstream project built against
  # venice-cpp three ways — add_subdirectory, FetchContent, and an installed
  # find_package — asserting each yields venice-cpp::lib and drags nothing else
  # along. Deliberately NOT part of the ctest suite above: it configures four
  # separate builds and clones dependencies over the network, which is the wrong
  # cost to put on every `ctest` run.
  #
  # Both compilers, because a usage requirement (cxx_std_23, the include
  # directories, httplib's TLS define) can propagate on one and not the other.
  consumer:
    name: consumer / ${{ matrix.cxx }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the installed package advertises `git describe`'s version; a shallow clone would publish 0.0.0

      - name: Install OpenSSL headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install Clang
        if: ${{ startsWith(matrix.cxx, 'clang') }}
        env:
          CLANG_VERSION: "20"
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$CLANG_VERSION"
          sudo ln -sf "/usr/bin/clang-$CLANG_VERSION"   /usr/local/bin/clang
          sudo ln -sf "/usr/bin/clang++-$CLANG_VERSION" /usr/local/bin/clang++
          clang++ --version

      - name: Verify all three consumption modes
        env:
          CXX: ${{ matrix.cxx }}
          # VENICE_DEPS_CACHE is deliberately unset: fetching the dependencies for
          # real is part of what this job tests.
        run: ./example/consumer/verify.sh

  # Fast, dependency-free guards for checked repository metadata (no compiler,
  # parser, or network). They also run inside every build job above via ctest;
  # this job gives quick, isolated feedback.
  metadata-selftests:
    name: metadata self-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run version_selftest.cmake
        run: cmake -P cmake/version_selftest.cmake
      - name: Run readme_tag_selftest.cmake
        run: cmake -P cmake/readme_tag_selftest.cmake
      - name: Run openapi_manifest_selftest.cmake
        run: cmake -P cmake/openapi_manifest_selftest.cmake
      # actions/checkout is shallow here. This deliberately proves artifact
      # rule B6 skips only its tag-age comparison when no tags are present.
      - name: Run check_artifacts.cmake without fetched tags
        run: cmake -P cmake/check_artifacts.cmake
